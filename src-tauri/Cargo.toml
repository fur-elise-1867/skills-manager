[package]
name = "skills-manager"
version = "1.42.0"
description = "Skills Manager - AI Agent Skills Central Manager"
authors = ["tianliang"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
default-run = "skills-manager"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["cli"]
cli = []
sds = ["dep:sevenz-turbo", "dep:rawzip", "dep:flate2", "dep:bzip2", "dep:deflate64"]

[[bin]]
name = "skills-manager-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.0", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
sha2 = "0.10"
dirs = "5.0"
walkdir = "2.5"
fs2 = "0.4"
unicode-normalization = "0.1"
caseless = "0.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
anyhow = "1.0"
chrono = "0.4"
gethostname = "1"
serde_yaml = "0.9"
git2 = { version = "0.19", features = ["vendored-openssl"] }
tokio = { version = "1", features = ["full"] }
regex = "1"
hex = "0.4"
urlencoding = "2"
zip = "2"
sevenz-turbo = { version = "=0.29.0", optional = true, default-features = false, features = ["bzip2", "deflate", "ppmd"] }
rawzip = { version = "=0.5.2", optional = true }
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6", optional = true }
deflate64 = { version = "0.1", optional = true }
tempfile = "3.26.0"
semver = "1"
aes-gcm = "0.10"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "6.1.1"
clap = { version = "4.5", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
junction = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
sevenz-turbo = { version = "=0.29.0", default-features = false, features = ["compress", "aes256", "native-crypto"] }

[[example]]
name = "sds-package-fixtures"
path = "examples/sds-package-fixtures.rs"
required-features = ["sds"]
