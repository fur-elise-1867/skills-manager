name: Company Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Dependencies
        run: npm ci
      - name: Company release checks
        run: |
          npm run check:company-release
          npm run test:company-contract
          npm run test:company
          npm run lint
          cargo test --manifest-path src-tauri/Cargo.toml --test company_flows
      - name: Build Windows release
        run: npm run tauri:build
      - name: Retain Windows artifacts for IT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: company-skills-manager-windows
          path: |
            src-tauri/target/release/skills-manager.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
